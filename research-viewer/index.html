<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Research PDF</title>
<link rel="icon" href="/images/favicon.svg">
<style>
html,body{margin:0;width:100%;height:100%;background:#525659;font-family:Arial,sans-serif}
#reader-toolbar{height:44px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ffffff26}
#reader-back{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:white;font-size:14px;text-decoration:none;border-radius:4px}
#reader-back:hover{background:#ffffff1a}#reader-back:focus-visible{outline:2px solid white;outline-offset:-3px}
#document-container{position:absolute;inset:44px 0 0;overflow:auto;outline:none}
.pdfViewer{padding:8px 0}
#image-container{position:absolute;inset:44px 0 0;overflow:auto;display:grid;place-items:center}
#image-container[hidden],#document-container[hidden]{display:none}
#image-container img{display:block;max-width:100%;max-height:calc(100dvh - 44px);object-fit:contain;cursor:zoom-in}
#image-container.enlarged{place-items:start}#image-container.enlarged img{max-width:none;max-height:none;cursor:zoom-out;margin:auto}
body:not([data-ready="true"]) #pdf-pages,body:not([data-ready="true"]) #image-container img{visibility:hidden;opacity:0}
#loading{position:fixed;inset:44px 0 0;display:grid;place-items:center;pointer-events:none;color:white;font-size:16px}
#loading[hidden]{display:none}#loading a{color:white;pointer-events:auto}
#loading[data-state="loading"]{color:transparent}
#loading[data-state="loading"]::before{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-12px;border:2px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:reader-spin .8s linear infinite}
@keyframes reader-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#loading[data-state="loading"]::before{animation:none}}
@media print{html,body{background:white}#document-container{position:static;overflow:visible}.pdfViewer .page{break-after:page;margin:0;border:0}#loading,#reader-toolbar{display:none}#image-container{inset:0}}
</style></head><body data-ready="false">
<nav id="reader-toolbar" aria-label="Research navigation"><a id="reader-back" href="/cv/" title="Back to project (Esc)">← Back to project</a></nav>
<div id="document-container" tabindex="0" aria-label="PDF document"><div class="pdfViewer" id="pdf-pages"></div></div>
<div id="image-container" hidden></div><div id="loading" role="status" data-state="loading">Loading document…</div>
<script>
// Only return through history when this reader was opened in place by the CV.
var inlineReader=new URLSearchParams(location.search).get('from')==='cv';
var fromCv=false;
try{var sourcePage=new URL(document.referrer);fromCv=sourcePage.origin===location.origin&&sourcePage.pathname==='/cv/';}catch(_){}
function returnToProject(){
 if(inlineReader&&fromCv&&history.length>1){history.back();return;}
 location.replace(document.body.dataset.returnUrl||'/cv/');
}
document.getElementById('reader-back').addEventListener('click',function(event){
 if(event.button!==0||event.ctrlKey||event.metaKey||event.altKey||event.shiftKey)return;
 event.preventDefault();returnToProject();
});
document.addEventListener('keydown',function(event){
 if(event.key!=='Escape'||event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
 if(inlineReader){event.preventDefault();returnToProject();return;}
 event.preventDefault();window.close();
 setTimeout(function(){location.replace(document.body.dataset.returnUrl||'/cv/');},100);
});
</script><script type="module" src="reader.js?v={{ site.github.build_revision }}"></script></body></html>
