<div class="cv-contents">
  <button class="cv-contents__toggle" type="button" aria-expanded="false" aria-controls="cv-contents-panel">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
    Contents
  </button>
  <nav class="cv-contents__panel" id="cv-contents-panel" aria-label="CV contents" hidden>
    <a href="#education">Education</a>
    <a href="#research-interests">Research Interests</a>
    <a href="#current-research">Current Research</a>
    <a href="#research-projects">Research Projects</a>
    <div class="cv-contents__projects">
      {% for project in site.data.projects %}
      <a href="#{{ project.id }}">{{ project.short_title }}</a>
      {% endfor %}
    </div>
    <a href="#contact">Contact</a>
  </nav>
</div>
