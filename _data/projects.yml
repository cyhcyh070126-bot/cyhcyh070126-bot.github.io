- id: fem-neural-operator
  title: GPU-accelerated Hybrid Finite Element–Neural Operator Solver
  short_title: Hybrid FE–NO Solver
  preview: /images/research/cylinder_subdomain_supports_1234.png
  preview_alt: Cylinder FEM and neural-operator subdomains connected through a shared interface.
  preview_caption: Cylinder subdomain layout
  status: Ongoing
  description: >-
    A hybrid solver based on non-overlapping domain decomposition, with FEM
    and neural-operator subdomains connected through a shared interface.
    The two solvers exchange interface displacements and reaction forces
    iteratively across this interface. Uses
    GPU-accelerated JAX-FEM simulations to generate training data
    and trains Transolver in JAX to learn mappings from interface displacement
    fields to local stress fields.
  research_url: /cv/#fem-neural-operator
  repository:

- id: convlstm-battery
  title: ConvLSTM Prediction of Concentration and Stress Fields in Battery Materials
  short_title: ConvLSTM
  preview: /images/research/battery_concentration.gif
  preview_alt: Lithium concentration evolution in the COMSOL simulation dataset.
  preview_caption: Concentration evolution · COMSOL
  description: >-
    Trains conditional ConvLSTM models in PyTorch to predict future sequences
    of concentration and stress fields in polycrystalline battery materials. Separate
    models for each field use past field images, grain-orientation maps, and
    C-rate inputs, with MATLAB–COMSOL simulation data and a combined MSE and SSIM loss.
  research_url: /cv/#convlstm-battery
  repository: https://github.com/cyhcyh070126-bot/convlstm-battery-field-prediction#readme

- id: burgers-pinn
  title: PINNs for Shock Capturing in the Burgers Equation
  short_title: PINNs
  preview: /images/research/burgers_standard_pinn_prediction.gif
  preview_alt: Standard PINN prediction compared with the analytical Burgers shock solution.
  preview_caption: Standard PINN prediction
  description: >-
    Trains PINNs in PyTorch to predict shock propagation in the one-dimensional
    Burgers equation, using PDE-residual, initial-condition, and boundary-condition
    losses. Compares standard and constant-artificial-viscosity PINNs against
    the analytical inviscid solution to assess the predicted shock profiles.
  research_url: /cv/#burgers-pinn
  repository: https://github.com/cyhcyh070126-bot/burgers-pinn#readme

- id: mechanics-llm
  title: Domain-Specific LLM Fine-Tuning for Mechanics of Materials
  short_title: LLM Fine-Tuning
  preview: /images/research/llm_finetuning_workflow_v2.png
  preview_alt: Mechanics dataset preparation, LoRA fine-tuning, and model release workflow.
  preview_caption: Fine-tuning and release workflow
  description: >-
    Adapts Qwen2.5-7B for question answering and concept explanation in mechanics
    of materials through LoRA fine-tuning on Google Colab. Uses curated
    instruction–response examples from textbooks and technical literature,
    with datasets and fine-tuned models released on Hugging Face.
  research_url: /cv/#mechanics-llm
  repository: https://huggingface.co/CYHcyh66
  repository_label: Hugging Face
