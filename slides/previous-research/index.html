<script>
'use strict';
const texts=["Previous Research", "Previous Research Project 1:  Domain-Specific LLM Fine-Tuning for Materials Mechanics Release 4 Hugging Face Released datasets and fine-tuned models on Hugging Face. Data Collection 1 VS Code   Collected data from textbooks and technical literature and notes. Textbooks T echnical literature N otes LoRA  Fine-Tuning Google Colab 3 Fine-tuned Qwen2.5-7B with  LoRA  using Google  Colab . LoRA Dataset Generation  2 Instruction Data Built an instruction dataset in VS Code . Instruction Defines the task or role. Input   Provides the specific materials mechanics question. Output Gives the target response.", "Previous Research Project 1: Domain-Specific LLM Fine-Tuning for Materials Mechanics Hugging Face Open-Source Release 2 Datasets CYHcyh66/Material-mechanics (67 downloads) CYHcyh66/Material-mechanics-merge (29 downloads) 2 Models CYHcyh66/ AI_Material_mechanics_assistant   (263 downloads) CYHcyh66/ AI_Material_mechanics_assistant_merged   (265 downloads) Models Datasets", "2 .  Simulation Outputs Polycrystalline Particle Microstructure Lithium Concentration Field Von Mises Stress Field Each case contains a polycrystalline microstructure with coupled field outputs.  Export synchronized lithium-concentration  fields  and von Mises stress fields over time. Previous Research Project 2:  ConvLSTM  Modeling for Chemo-Mechanical Field Prediction 1.MATLAB and COMSOL  LiveLink    Automatic simulation workflow Generate statistically distributed  polycrystalline     microstructures.  Run coupled lithium-transport and mechanics simulations via  MATLAB–COMSOL  LiveLink .   Export synchronized lithium-concentration and von Mises stress  sequences data. 3 .  Inputs and Prediction Targets      Input:   Grain-orientation map, C-rate map, and past concentration fields  Target:   Future lithium-concentration fields Outputs:   Time-aligned lithium-concentration or von Mises stress fields Lithium Concentration Field Evolution V on Mises Stress Field Evolution", "2.  ConvLSTM  Model A  ConvLSTM  model uses five input frames and static conditions to predict  the next field. ConvLSTM  Cell Previous Research Project 2:  ConvLSTM  Modeling for Chemo-Mechanical Field Prediction Grain orientation Five previous field frames  C-rate 1. Inputs Five previous field frames and static conditions are used as inputs. G C 3. Autoregressive Rollout Future fields are predicted using a 5-frame sliding window with previous predictions. Model Model Model G C G C G C Step 1 Step 2 Step  3 4. Training Strategy Combine frame-wise accuracy and structural similarity.  A. Hybrid Loss MSE :  frame-wise accuracy SSIM :  structural similarity B. Scheduled Sampling During training, the latest input is sampled from  ground truth or prediction , with     gradually decreasing. Ground-truth input Model-generated input during training", "Previous Research Project 2:  ConvLSTM  Modeling for Chemo-Mechanical Field Prediction Lithium Concentration Field   — Autoregressive Prediction Result |  Mean MSE = 1.005 × 10⁻³ N = 60 C-rate = 4C Example", "Previous Research Project 3: PINNs for Shock Capturing in Nonlinear PDEs 2. PINN Framework Hidden Layers:   8   Width:   64   Activation Function:  tanh Collocation Points:   24576 1. Problem Setup Boundary Condition Initial Condition Computational Domain 1D Inviscid Burgers' Equation", "Computational Domain Previous Research Project 3: PINNs for Shock Capturing in Nonlinear PDEs Collocation Points PDE Collocation Points Boundary-Condition Points Left Right Initial-Condition Points Left Right", "Previous Research Project 3: PINNs for Shock Capturing in Nonlinear PDEs Standard PINN  (Baseline)", "Previous Research Project 3: PINNs for Shock Capturing in Nonlinear PDEs Global Artificial-Viscosity PINN"];
const $=id=>document.getElementById(id), slides=[...document.querySelectorAll('.slide')];
let current=1,playing=true;
document.querySelectorAll('.animation img').forEach(img=>img.addEventListener('error',()=>{if(img.getAttribute('src')&&img.dataset.fallback&&!img.src.endsWith(img.dataset.fallback)){img.src=img.dataset.fallback;}}));
function show(n,update=true){
 n=Math.max(1,Math.min(slides.length,Number(n)||1));current=n;
 slides.forEach((s,i)=>{s.hidden=i!==n-1;s.querySelectorAll('.animation img').forEach(img=>{if(i===n-1&&playing){if(!img.getAttribute('src'))img.src=img.dataset.src;}else img.removeAttribute('src');});});
 const active=slides[n-1],bg=active.querySelector('.background');if(!bg.getAttribute('src'))bg.src=bg.dataset.src;
 $('slide-select').value=String(n);$('prev').disabled=n===1;$('next').disabled=n===slides.length;$('status').textContent=n+' / '+slides.length;$('transcript').textContent=texts[n-1];
 document.querySelectorAll('[data-slide]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.slide)===n)));
 if(update)history.replaceState(null,'','#slide-'+n);
 // Finish the visible page first; fetch only one page ahead at low priority.
 bg.decode().catch(()=>{}).then(()=>{if(current!==n||n>=slides.length)return;const upcoming=slides[n].querySelector('.background');if(!upcoming.getAttribute('src')){upcoming.fetchPriority='low';upcoming.src=upcoming.dataset.src;}});
}
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('slide-select').onchange=e=>show(e.target.value);
document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{show(b.dataset.slide);$('viewer').scrollIntoView({block:'start'});});
$('motion').onclick=()=>{playing=!playing;$('viewer').classList.toggle('playing',playing);$('motion').textContent=playing?'Pause GIFs':'Play GIFs';$('motion').setAttribute('aria-pressed',String(!playing));show(current,false);};
function fullLabel(){$('fullscreen').textContent=document.fullscreenElement||$('viewer').classList.contains('expanded')?'Exit full screen':'Full screen';}
$('fullscreen').onclick=async()=>{const v=$('viewer');if(document.fullscreenElement)await document.exitFullscreen();else if(v.classList.contains('expanded')){v.classList.remove('expanded');document.body.style.overflow='';}else{try{if(!v.requestFullscreen)throw Error();await v.requestFullscreen();}catch{v.classList.add('expanded');document.body.style.overflow='hidden';}}fullLabel();};
document.addEventListener('fullscreenchange',fullLabel);
document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(current-1);}if(e.key==='Home'){e.preventDefault();show(1);}if(e.key==='End'){e.preventDefault();show(slides.length);}if(e.key==='Escape'){$('viewer').classList.remove('expanded');document.body.style.overflow='';fullLabel();}});
window.addEventListener('hashchange',()=>show(location.hash.match(/^#slide-(\d+)$/)?.[1]||1,false));
show(location.hash.match(/^#slide-(\d+)$/)?.[1]||1,false);
</script>
