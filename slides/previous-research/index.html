<style>
:root{color-scheme:light;--accent:#9d641b;--line:#dfd5c8}
*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#42474b;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header,main{max-width:1600px;margin:auto;padding:16px 24px}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:24px;margin:0;color:var(--accent)}a{color:#217c99;display:inline-block;max-width:100%;text-decoration-line:underline;text-underline-offset: 0.3em;
  text-decoration-thickness: 1px;
  text-decoration-skip-ink: auto;transform-origin: left center;
  transition: color 150ms ease, background-color 150ms ease, text-decoration-color 150ms ease, border-color 150ms ease, scale 150ms ease;}a:focus-visible{color:#267e97;text-decoration-line:underline;scale:var(--link-hover-scale, 1.04)}button,select{font:inherit;background:#fff;color:inherit;border:1px solid var(--line);border-radius:5px;padding:8px 12px;min-height:44px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #288bab;outline-offset:3px}
#viewer{background:#eeeae4;border:1px solid var(--line);border-radius:6px;overflow:hidden}#stage{display:flex;align-items:center;justify-content:center;padding:12px;min-height:150px}.slide{position:relative;width:min(100%,calc((100dvh - 220px)*16/9));aspect-ratio:16/9;background:#fff;box-shadow:0 2px 9px #0002}.slide[hidden]{display:none}.background{display:block;width:100%;height:100%}.animation{position:absolute;overflow:hidden;background:white;display:none}.animation img,.animation video{position:absolute;max-width:none}.animation video{object-fit:fill}.animation{visibility:hidden}.animation.ready{visibility:visible}.background{opacity:0}.background.loaded{opacity:1}.slide{background-size:100% 100%;background-repeat:no-repeat}#viewer.playing .slide:not([hidden]) .animation{display:block}.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px;background:#faf9f7;border-top:1px solid var(--line)}select{max-width:440px;min-width:0;flex:1}#status{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}.hint{font-size:14px;margin:12px 0;color:#626970}details{margin:18px 0}summary{cursor:pointer;color:var(--accent);padding:6px 0}.thumbnails{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:12px 0}.thumbnails button{padding:6px;text-align:left}.thumbnails img{width:100%;height:auto;display:block}.thumbnails span{display:block;padding:6px;font-size:13px}.thumbnails button[aria-current="true"]{border:2px solid var(--accent)}
#viewer:fullscreen,#viewer.expanded{width:100%;height:100dvh;border:0;border-radius:0;display:flex;flex-direction:column;background:#1e2226}#viewer.expanded{position:fixed;inset:0;z-index:1000}#viewer:fullscreen #stage,#viewer.expanded #stage{flex:1;min-height:0}#viewer:fullscreen .slide,#viewer.expanded .slide{width:min(100%,calc((100dvh - 100px)*16/9))}#viewer:fullscreen .toolbar,#viewer.expanded .toolbar{flex:none}
@media(max-width:650px){header,main{padding:12px}header{gap:8px 20px}h1{font-size:21px}#stage{padding:4px}.toolbar{gap:6px;padding:8px}select{flex-basis:65%;max-width:none}.slide{width:100%}.hint{font-size:13px}.toolbar button{padding:7px 10px}#viewer:fullscreen .slide,#viewer.expanded .slide{width:min(100%,calc((100dvh - 165px)*16/9))}}
@media(max-height:500px) and (orientation:landscape){header{padding:6px 16px}h1{font-size:18px}main{padding:6px 12px}.slide{width:min(100%,calc((100dvh - 140px)*16/9))}.toolbar{padding:4px}#stage{padding:4px}#viewer:fullscreen .slide,#viewer.expanded .slide{width:min(100%,calc((100dvh - 65px)*16/9))}}
/* Match the site's shared link interaction in assets/css/main.scss. */
@media(hover:hover) and (pointer:fine){a:hover{color:#267e97;text-decoration-line:underline;scale:var(--link-hover-scale, 1.04)}}
@media(prefers-reduced-motion:reduce){a{transition:none}a:is(:hover,:focus-visible){scale:none}}
</style>

<script>
'use strict';
const $=id=>document.getElementById(id), slides=[...document.querySelectorAll('.slide')];
let current=1,playing=true;
const loadBackground=(slide,priority='auto')=>{
 const img=slide.querySelector('.background');img.fetchPriority=priority;
 if(!img.getAttribute('src'))img.src=img.dataset.src;
 return img.decode().then(()=>img.classList.add('loaded')).catch(()=>{});
};
function useFallback(video){
 const wrap=video.parentElement;if(wrap.querySelector('img'))return;
 video.pause();const img=new Image();img.alt=video.getAttribute('aria-label');img.style.cssText=video.style.cssText;
 img.onload=()=>{video.hidden=true;wrap.classList.add('ready');};
 img.src=video.dataset.fallback;wrap.append(img);
}
function loadVideo(video,play=false){
 if(!video.getAttribute('src')){video.src=video.dataset.src;video.load();}
 if(play&&playing)video.play().catch(()=>{if(video.closest('.slide').hidden||!playing)return;useFallback(video);});
}
document.querySelectorAll('.animation video').forEach(video=>{
 video.muted=true;
 video.addEventListener('loadeddata',()=>video.parentElement.classList.add('ready'));
 video.addEventListener('error',()=>useFallback(video));
});
function show(n,update=true){
 n=Math.max(1,Math.min(slides.length,Number(n)||1));current=n;
 slides.forEach((s,i)=>{s.hidden=i!==n-1;s.querySelectorAll('video').forEach(v=>{if(i===n-1&&playing)loadVideo(v,true);else v.pause();});});
 const active=slides[n-1];
 $('slide-select').value=String(n);$('prev').disabled=n===1;$('next').disabled=n===slides.length;$('status').textContent=n+' / '+slides.length;
 document.querySelectorAll('[data-slide]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.slide)===n)));
 if(update)history.replaceState(null,'','#slide-'+n);
 // Show the requested page first. Keep visited assets cached and warm the next page.
 loadBackground(active,'high').then(async()=>{
  if(current!==n||document.hidden)return;
  for(const offset of [1,2]){
   const next=slides[n-1+offset];if(!next||current!==n)break;
   await loadBackground(next,'low');
   if(offset===1&&current===n)next.querySelectorAll('video').forEach(v=>loadVideo(v));
  }
 });
}
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('slide-select').onchange=e=>show(e.target.value);
document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{show(b.dataset.slide);$('viewer').scrollIntoView({block:'start'});});
$('motion').onclick=()=>{playing=!playing;$('viewer').classList.toggle('playing',playing);$('motion').textContent=playing?'Pause GIFs':'Play GIFs';$('motion').setAttribute('aria-pressed',String(!playing));show(current,false);};
function fullLabel(){$('fullscreen').textContent=document.fullscreenElement||$('viewer').classList.contains('expanded')?'Exit full screen':'Full screen';}
$('fullscreen').onclick=async()=>{const v=$('viewer');if(document.fullscreenElement)await document.exitFullscreen();else if(v.classList.contains('expanded')){v.classList.remove('expanded');document.body.style.overflow='';}else{try{if(!v.requestFullscreen)throw Error();await v.requestFullscreen();}catch{v.classList.add('expanded');document.body.style.overflow='hidden';}}fullLabel();};
let wasFullscreen=!!document.fullscreenElement,fullscreenExitedAt=-Infinity;
document.addEventListener('fullscreenchange',()=>{
 const isFullscreen=!!document.fullscreenElement;
 if(wasFullscreen&&!isFullscreen)fullscreenExitedAt=performance.now();
 wasFullscreen=isFullscreen;fullLabel();
});
document.addEventListener('keyup',e=>{if(e.key==='Escape')fullscreenExitedAt=-Infinity;});
function escapeViewer(e){
 e.preventDefault();if(e.repeat)return;
 if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}
 if($('viewer').classList.contains('expanded')){
  $('viewer').classList.remove('expanded');document.body.style.overflow='';fullLabel();return;
 }
 // Some browsers dispatch Escape just after their native full-screen exit.
 if(performance.now()-fullscreenExitedAt<250)return;
 window.location.assign($('back-to-projects').href);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){escapeViewer(e);return;}if(e.target.matches('select,input,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(current-1);}if(e.key==='Home'){e.preventDefault();show(1);}if(e.key==='End'){e.preventDefault();show(slides.length);}});
window.addEventListener('hashchange',()=>show(location.hash.match(/^#slide-(\d+)$/)?.[1]||1,false));
show(location.hash.match(/^#slide-(\d+)$/)?.[1]||1,false);
</script>
